<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon night short — stage</title>
<!-- 5 · NEON: a synthwave night — a striped sun rising behind a neon outline
     of the Himalaya, a moving grid floor, sweeping stage lights, flickering
     neon signs, a neon billboard with the poster's QR — then the phone scans
     it and buys, to 100 bpm synthwave. Edit: specs.js (neon). -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Monoton&family=Inter:wght@600;700;800&display=block" rel="stylesheet">
<script src="specs.js"></script>
<script src="../stagekit.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05020f; }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #05020f 0%, #1a0536 45%, #4c0a5e 62%, #05020f 62.1%, #05020f 100%); }
  .layer { position: absolute; inset: 0; }
  .aw { font-family: Audiowide, sans-serif; }
  .pink { color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px #ff2e97, 0 0 40px #ff2e97, 0 0 80px #ff2e97; }
  .cyan { color: #fff; text-shadow: 0 0 6px #fff, 0 0 18px #22d3ee, 0 0 40px #22d3ee, 0 0 80px #22d3ee; }
  .yellow { color: #fff7cc; text-shadow: 0 0 6px #fff, 0 0 18px #facc15, 0 0 40px #f59e0b, 0 0 80px #f59e0b; }
  .sign { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  #sun { position: absolute; left: 290px; width: 500px; height: 500px; border-radius: 50%;
    background: linear-gradient(180deg, #fde047 0%, #fb923c 45%, #ec4899 100%);
    -webkit-mask: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88% 95%, #000 95%);
    box-shadow: 0 0 120px rgba(236,72,153,.6); }
  #floor { position: absolute; left: -1000px; width: 3080px; top: 1190px; height: 1400px; transform-origin: 50% 0; transform: perspective(500px) rotateX(72deg);
    background-image: linear-gradient(90deg, rgba(255,46,151,.85) 3px, transparent 3px), linear-gradient(0deg, rgba(255,46,151,.85) 3px, transparent 3px); background-size: 120px 120px; }
  .beam { position: absolute; bottom: -100px; width: 0; height: 0; transform-origin: 0 0; }
  .beam i { position: absolute; left: -130px; bottom: 0; width: 260px; height: 2200px; background: linear-gradient(0deg, rgba(34,211,238,.28), rgba(34,211,238,0)); clip-path: polygon(45% 100%, 55% 100%, 100% 0, 0 0); }
  .kphone { box-shadow: 0 0 0 4px #22d3ee, 0 0 30px #22d3ee, 0 0 80px rgba(34,211,238,.6) !important; }
  .kticket { box-shadow: 0 0 0 4px #ff2e97, 0 0 30px #ff2e97, 0 0 90px rgba(255,46,151,.55) !important; }
  #eq { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; display: flex; align-items: flex-end; gap: 8px; padding: 0 14px; }
  #eq span { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(0deg, #ff2e97, #22d3ee); box-shadow: 0 0 16px rgba(255,46,151,.6); }
</style>
</head>
<body>
<div id="frame">
  <div class="layer" id="stars"></div>
  <div id="sun"></div>
  <svg class="layer" id="peaks" width="1080" height="1920" style="overflow:visible"></svg>
  <div id="floor"></div>
  <div class="layer" id="beams"></div>

  <section class="layer" id="open">
    <div class="sign aw pink" id="n0" style="top:260px;font-size:94px">SUGAM POKHREL</div>
    <div class="sign aw cyan" id="n1" style="top:400px;font-size:84px">&amp; BAJAGAJA</div>
    <div class="sign" id="n2" style="top:520px"><span class="yellow" style="font:400 170px/1 Monoton,sans-serif">LIVE</span></div>
    <div class="sign aw cyan" id="n3" style="top:720px;font-size:58px">HEIDELBERG · 10.10</div>
  </section>

  <section class="layer" id="bill" style="display:none">
    <div class="sign aw pink" id="b-t" style="top:230px;font-size:86px">ONE NIGHT.</div>
    <div class="sign aw cyan" id="b-t2" style="top:340px;font-size:86px">ONE SCAN.</div>
    <div id="b-board" style="position:absolute;left:300px;top:480px;width:480px;height:680px;border-radius:12px;box-shadow:0 0 0 5px #ff2e97,0 0 40px #ff2e97,0 0 120px rgba(255,46,151,.5)">
      <img src="../out/dashain/media/poster-main.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:10px">
      <div id="b-qr" style="position:absolute;right:-40px;bottom:-40px;width:200px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 0 0 4px #22d3ee,0 0 40px #22d3ee">
        <div style="font:800 17px/1 Inter,sans-serif;color:#dc143c;text-align:center;letter-spacing:.12em;margin-bottom:6px">TICKETS</div><div class="qr" style="width:180px;height:180px"></div>
      </div>
    </div>
  </section>

  <section class="layer" id="phonepart" style="display:none">
    <div class="sign aw cyan" id="cap" style="top:215px;font-size:64px"></div>
    <div id="phonehost" class="layer"></div>
    <div class="sign aw pink" id="youin" style="top:215px;font-size:92px">YOU'RE IN.</div>
    <div id="tickethost" class="layer"></div>
  </section>

  <section class="layer" id="cta" style="display:none">
    <div class="sign aw pink" id="c0" style="top:220px;font-size:120px">DON'T MISS</div>
    <div class="sign aw cyan" id="c1" style="top:370px;font-size:120px">THE NIGHT</div>
    <div class="sign aw yellow" id="c2" style="top:540px;font-size:58px">SAT 10.10 · HEIDELBERG</div>
    <div class="sign" id="c3" style="top:630px;font:700 34px/1.3 Inter,sans-serif;color:#f5d0fe">Sugam Pokhrel &amp; Bajagaja · Dinner · Dance</div>
    <div id="c-card" style="position:absolute;left:110px;right:110px;top:740px;height:330px;border-radius:30px;background:rgba(10,4,24,.85);box-shadow:0 0 0 4px #22d3ee,0 0 40px #22d3ee;display:flex;align-items:center;gap:34px;padding:0 34px">
      <div class="qr" style="width:250px;height:250px;flex:none;background:#fff;padding:10px;border-radius:16px"></div>
      <div><div style="font:600 30px/1.2 Inter,sans-serif;color:#c4b5fd">Tickets at</div><div class="aw pink" style="font-size:56px;margin-top:12px;line-height:1.1">martnepali<br>.com</div></div>
    </div>
    <div id="c-logos" style="position:absolute;left:0;right:0;top:1110px;display:flex;justify-content:center;align-items:center;gap:24px;font:600 26px/1.3 Inter,sans-serif;color:#e9d5ff">
      <div style="width:100px;height:100px;border-radius:50%;background:#fff;padding:7px;box-shadow:0 0 24px #ff2e97"><img src="../out/dashain/media/logo-npjoe.jpg" style="width:100%;height:100%;object-fit:contain"></div>
      <div style="width:100px;height:100px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 24px #22d3ee"><img src="../out/dashain/media/logo-neg.jpg" style="width:100%;height:100%;object-fit:contain"></div>
      <span>Presented by NPJOE e.V.<br>&amp; Nepali Events Germany</span>
    </div>
  </section>
  <div id="eq"></div>
</div>
<script>
const { $, $$, clamp, lerp, prog, eOut, eOut5, eIO, eBack, css } = K;
const S = SPECS.S.neon;
let phone;
const STARS = [];

async function setup(qr) {
  let seed = 5; const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 90; i++) {
    const d = document.createElement('span');
    const sz = 2 + r() * 3;
    css(d, { position: 'absolute', left: r() * 1080 + 'px', top: r() * 1100 + 'px', width: sz + 'px', height: sz + 'px', borderRadius: '50%', background: '#fff' });
    $('#stars').appendChild(d); STARS.push({ d, ph: r() * 6.28, sp: 1 + r() * 3 });
  }
  // The Himalaya as a neon line — two ridges.
  const ridge = (pts) => pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join(' ');
  const back = [[-20, 1190], [80, 1080], [170, 1130], [300, 930], [390, 1030], [480, 900], [560, 990], [640, 860], [760, 1010], [860, 940], [960, 1060], [1100, 980]];
  const front = [[-20, 1190], [120, 1120], [230, 1150], [360, 1050], [450, 1110], [540, 1000], [620, 1090], [720, 1030], [820, 1120], [930, 1060], [1100, 1190]];
  $('#peaks').innerHTML = `<path id="rb" d="${ridge(back)}" fill="none" stroke="#ff2e97" stroke-width="5" style="filter:drop-shadow(0 0 10px #ff2e97) drop-shadow(0 0 24px #ff2e97)"/>
    <path id="rf" d="${ridge(front)} L1100 1192 L-20 1192 Z" fill="#05020f" stroke="#22d3ee" stroke-width="6" style="filter:drop-shadow(0 0 10px #22d3ee) drop-shadow(0 0 26px #22d3ee)"/>`;
  for (const p of $$('#peaks path')) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; }
  $('#beams').innerHTML = [120, 960, 540].map((x) => `<div class="beam" style="left:${x}px"><i></i></div>`).join('');
  $('#eq').innerHTML = '<span></span>'.repeat(28);
  phone = new K.Phone($('#phonehost'), { width: 540, look: 'bare' });
  css(phone.el, { left: '270px', top: '380px' });
  const tk = K.ticket({ theme: 'neon', qr: qr || '' });
  css(tk, { left: '220px', top: '420px' });
  $('#tickethost').appendChild(tk);
  await K.ready(qr);
}

// A neon tube switching on: a few stutters, then a steady hum.
function neon(el, t, at) {
  if (t < at) { el.style.opacity = 0; return; }
  const k = t - at;
  const pattern = [1, 0, 1, 0, 0, 1, 1, 0.3, 1];
  el.style.opacity = k < 0.45 ? pattern[Math.floor(k * 20) % pattern.length] : 0.93 + 0.07 * Math.sin(t * 40);
}

function render(t) {
  const bph = ((t - S.G0) / S.B), pulse = Math.exp(-(((bph % 1) + 1) % 1) * 5);
  for (const s of STARS) s.d.style.opacity = 0.3 + 0.7 * Math.abs(Math.sin(t * s.sp + s.ph));
  const rise = eOut(prog(t, 0, 1.6));
  css($('#sun'), { top: lerp(1150, 700, rise) + 'px', opacity: String(0.25 + 0.75 * rise) });
  $$('#peaks path').forEach((p, i) => { p.style.strokeDashoffset = (1 - eIO(prog(t, 0.1 + i * 0.2, 1.3 + i * 0.2))) * +p.dataset.len; });
  $('#floor').style.backgroundPosition = `0 ${(t * 240) % 120}px`;
  $$('#beams .beam').forEach((b, i) => { b.style.transform = `rotate(${Math.sin(t * 0.9 + i * 2.1) * 28 + (i - 1) * 8}deg)`; b.style.opacity = 0.6 + 0.4 * pulse; });
  $$('#eq span').forEach((e, i) => {
    const v = 0.25 + 0.75 * Math.abs(Math.sin(i * 1.7 + Math.floor(bph * 2) * 2.3)) * (0.5 + 0.5 * pulse);
    e.style.height = (t > S.G0 ? v * 150 : 6) + 'px';
  });

  // Opening signs.
  const O = $('#open');
  O.style.display = t < S.billboard + 0.3 ? 'block' : 'none';
  if (O.style.display === 'block') {
    O.style.opacity = 1 - prog(t, S.billboard - 0.1, S.billboard + 0.3);
    neon($('#n0'), t, S.signs[0]); neon($('#n1'), t, S.signs[1]); neon($('#n2'), t, S.signs[2]); neon($('#n3'), t, S.signs[2] + 0.3);
    $('#n2').style.transform = `scale(${1 + 0.05 * pulse})`;
  }

  // The billboard.
  const Bl = $('#bill');
  Bl.style.display = t >= S.billboard && t < S.phone + 0.3 ? 'block' : 'none';
  if (Bl.style.display === 'block') {
    Bl.style.opacity = 1 - prog(t, S.phone - 0.1, S.phone + 0.3);
    neon($('#b-t'), t, S.billboard + 0.1); neon($('#b-t2'), t, S.billboard + 0.5);
    const k = eOut5(prog(t, S.billboard, S.billboard + 0.6));
    $('#b-board').style.transform = `perspective(1400px) rotateX(${(1 - k) * 70}deg) translateY(${(1 - k) * 300}px)`;
    $('#b-qr').style.transform = `rotate(6deg) scale(${1 + 0.06 * pulse})`;
  }

  // Phone.
  const PP = $('#phonepart');
  PP.style.display = t >= S.phone && t < S.cta + 0.3 ? 'block' : 'none';
  if (PP.style.display === 'block') {
    PP.style.opacity = 1 - prog(t, S.cta - 0.1, S.cta + 0.3);
    const k = eOut5(prog(t, S.phone, S.phone + 0.6));
    const out = eIO(prog(t, S.ticketAt - 0.1, S.ticketAt + 0.5));
    phone.el.style.transform = `perspective(1600px) translateY(${(1 - k) * 1100 + out * 150}px) rotateX(${(1 - k) * 30}deg) scale(${1 - out * 0.1})`;
    phone.el.style.filter = `brightness(${1 - out * 0.6})`;
    phone.render(t, S);
    const caps = [[S.phone, 'SCAN THE POSTER'], [S.marks.event, 'GET TICKETS'], [S.marks.pick, 'PICK 2'], [S.marks.scroll, 'RESERVE']];
    let c = caps[0]; for (const x of caps) if (t >= x[0]) c = x;
    const cap = $('#cap');
    if (cap.textContent !== c[1]) cap.textContent = c[1];
    neon(cap, t < S.ticketAt ? t : -1, c[0]);
    neon($('#youin'), t, S.ticketAt + 0.3);
    const tk = $('.kticket'), tkk = prog(t, S.ticketAt + 0.05, S.ticketAt + 0.6);
    tk.style.opacity = clamp(tkk * 3);
    tk.style.transform = `perspective(1600px) translateY(${(1 - eOut5(tkk)) * 600}px) rotateX(${(1 - eOut(tkk)) * -40}deg) rotate(${Math.sin(t * 1.3) * 0.8}deg)`;
  }

  // CTA.
  const C = $('#cta');
  C.style.display = t >= S.cta ? 'block' : 'none';
  if (t >= S.cta) {
    neon($('#c0'), t, S.cta + 0.05); neon($('#c1'), t, S.cta + 0.35); neon($('#c2'), t, S.cta + 0.7);
    $('#c3').style.opacity = prog(t, S.cta + 0.9, S.cta + 1.2);
    K.popIn($('#c-card'), t, S.cta + 1.0, 0.8, 0.45);
    $('#c-logos').style.opacity = prog(t, S.cta + 1.5, S.cta + 1.9);
    $('#c0').style.transform = $('#c1').style.transform = `scale(${1 + 0.03 * pulse})`;
  }
}
window.setup = setup; window.render = render;
K.standalone(setup, render, S.TOTAL);
</script>
</body>
</html>
