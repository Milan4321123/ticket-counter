<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MartNepali studio — stage</title>
<!-- The 30 MartNepali ads (studio/scripts.js): ?id=sell-2-kinetic-myth&t=4 shows
     a moment, &play plays it. One stage, seven skins (blob, kinetic, paper,
     swiss, neon, pov, cinema); render(t) sets every element for second t. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@500;600;700;800;900&family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600;1,9..144,800&family=Space+Grotesk:wght@500;700&family=Audiowide&family=Mukta:wght@700;800&display=block" rel="stylesheet">
<script src="scripts.js"></script>
<script src="dashain-scripts.js"></script>
<script src="../brand/art.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  #shots { position: absolute; inset: 0; z-index: 10; }
  #fx { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
  .shot { position: absolute; inset: 0; display: none; }

  /* Themes: colours for text outside cards. */
  .t-light { --fg: #111; --dim: #6b7280; --soft: rgba(0,0,0,.05); --line: rgba(0,0,0,.08); }
  .t-dark { --fg: #fff; --dim: rgba(255,255,255,.7); --soft: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); }
  .skin-paper .t-light { --fg: #2b1d12; --dim: #7c4a1e; --soft: rgba(124,74,30,.07); --line: rgba(124,74,30,.15); }
  .skin-swiss .t-light { --fg: #0b0b14; --dim: #4b5563; }
  .skin-cinema .t-dark { --fg: #f5efe6; --dim: rgba(245,239,230,.62); }

  /* Cards, per skin. Inside a card the text colours are the card's. */
  .card { position: absolute; border-radius: 48px; color: var(--fg); }
  .t-light .card, .card.light { background: rgba(255,255,255,.93); box-shadow: 0 30px 80px rgba(20,20,20,.13); --fg: #111; --dim: #6b7280; --soft: rgba(0,0,0,.05); --line: rgba(0,0,0,.08); }
  .t-dark .card { background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1.5px solid rgba(255,255,255,.14); box-shadow: 0 40px 100px rgba(0,0,0,.45); }
  .skin-kinetic .card { background: #fff !important; border: 0 !important; border-radius: 10px; box-shadow: 18px 18px 0 var(--acc) !important; --fg: #0a0a0a; --dim: #555; --soft: rgba(0,0,0,.06); --line: rgba(0,0,0,.1); }
  .skin-paper .card { background: #fffaf0 !important; border: 2px solid rgba(194,65,12,.18) !important; border-radius: 34px; box-shadow: 0 30px 60px rgba(90,55,20,.22) !important; --fg: #2b1d12; --dim: #7c4a1e; --soft: rgba(124,74,30,.07); --line: rgba(124,74,30,.14); }
  .skin-swiss .card { background: #fff !important; border: 4px solid #0b0b14 !important; border-radius: 20px; box-shadow: 16px 16px 0 #0b0b14 !important; --fg: #0b0b14; --dim: #4b5563; --soft: rgba(0,0,0,.05); --line: rgba(0,0,0,.12); }
  .skin-neon .card { background: rgba(12,5,28,.9) !important; border: 0 !important; border-radius: 30px; box-shadow: 0 0 0 3px var(--acc), 0 0 40px var(--acc), 0 0 110px rgba(0,0,0,.6) !important; --fg: #fff; --dim: #c4b5fd; --soft: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); }
  .skin-pov .card { background: #fff !important; border: 0 !important; border-radius: 38px; box-shadow: 0 24px 70px rgba(0,0,0,.45) !important; --fg: #111; --dim: #6b7280; --soft: rgba(0,0,0,.05); --line: rgba(0,0,0,.08); }
  .skin-cinema .card { background: rgba(24,20,17,.82) !important; border: 1px solid rgba(245,239,230,.16) !important; border-radius: 22px; box-shadow: 0 40px 120px rgba(0,0,0,.7) !important; --fg: #f5efe6; --dim: rgba(245,239,230,.6); --soft: rgba(245,239,230,.06); --line: rgba(245,239,230,.12); }

  /* Type, per skin. */
  :root { --fd: 'Plus Jakarta Sans', sans-serif; --fw: 800; --fls: -.03em; --ftt: none; }
  .skin-kinetic { --fd: Anton, Impact, sans-serif; --fw: 400; --fls: .01em; --ftt: uppercase; }
  .skin-paper { --fd: Fraunces, Georgia, serif; --fw: 900; --fls: -.02em; }
  .skin-swiss { --fd: 'Space Grotesk', sans-serif; --fw: 700; --fls: -.045em; }
  .skin-neon { --fd: Audiowide, sans-serif; --fw: 400; --fls: .01em; --ftt: uppercase; }
  .skin-pov { --fd: Inter, sans-serif; --fw: 800; --fls: -.01em; }
  .skin-cinema { --fd: Fraunces, Georgia, serif; --fw: 600; --fls: -.01em; }
  .disp { font-family: var(--fd); font-weight: var(--fw); letter-spacing: var(--fls); text-transform: var(--ftt); }
  .wblock { position: absolute; left: 50px; right: 50px; text-align: center; }
  .wline { white-space: nowrap; line-height: 1.1; }
  .wd { display: inline-block; margin: 0 .12em; }
  .wsub { margin-top: 26px; font: 600 40px/1.3 Inter, sans-serif; color: var(--dim); }
  .skin-cinema .wd.acc { font-style: italic; }
  .skin-paper .wd.acc { font-style: italic; }
  .skin-neon .wd { text-shadow: 0 0 6px #fff, 0 0 18px var(--acc), 0 0 42px var(--acc); color: #fff !important; }
  .skin-neon .wd.acc { text-shadow: 0 0 6px #fff, 0 0 18px var(--acc2), 0 0 42px var(--acc2); }
  .skin-pov .wline { line-height: 1.55; }
  .skin-pov .wd { background: #fff; color: #111 !important; padding: 4px 16px; margin: 0 -4px; border-radius: 12px; }
  .skin-pov .wd.acc { background: var(--acc); color: var(--onacc) !important; }
  .skin-pov .wsub { display: inline-block; margin-top: 30px; padding: 10px 20px; border-radius: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 36px; }
  .skin-cinema .wsub { font: 500 32px/1.4 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .skin-kinetic .wsub { font: 700 36px/1.3 Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  .cap { position: absolute; left: 60px; right: 60px; text-align: center; font: 700 44px/1.3 Inter, sans-serif; color: var(--fg); }
  .skin-pov .cap span.box { background: #fff; color: #111; padding: 6px 16px; border-radius: 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.6; }
  .skin-neon .cap { text-shadow: 0 0 16px var(--acc), 0 2px 10px #000; }
  .skin-neon .wsub { color: #fff; text-shadow: 0 2px 10px #000, 0 0 3px #000; }

  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 18px 28px; border-radius: 999px; font: 700 36px/1 Inter, sans-serif; border: 2px solid var(--line); background: var(--soft); color: var(--fg); margin: 0 10px 14px 0; }
  .cursor { position: absolute; width: 58px; height: 70px; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 5px solid #fff; z-index: 49; opacity: 0; }
  .skin-paper .ripple, .skin-swiss .ripple { border-color: #111; }
  .shimmer { background: linear-gradient(90deg, var(--soft) 0%, rgba(160,160,160,.28) 50%, var(--soft) 100%); background-size: 300% 100%; }
  .art { position: absolute; }
  .mn { display: inline-block; } .mn svg { width: 100%; height: 100%; }
  .qr svg { width: 100%; height: 100%; }
  .stamp { position: absolute; padding: 14px 34px 6px; border: 12px solid var(--acc); border-radius: 22px; color: var(--acc); font: 400 180px/1 Anton, sans-serif; transform: rotate(-10deg); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="frame">
  <div id="world" class="layer"></div>
  <div id="shots"></div>
  <div id="fx"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eOut5 = (k) => 1 - Math.pow(1 - k, 5);
const eIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eBack = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; return el; };
const h = (tag, style = '', html = '') => { const e = document.createElement(tag); if (style) e.style.cssText = style; if (html) e.innerHTML = html; return e; };
const q = new URLSearchParams(location.search);
const AD = STUDIO.byId[q.get('id') || STUDIO.ADS[0].id];
const SK = AD.skin;
const T = STUDIO.TIMES;
const A = AD.accent, A2 = AD.accent2, ON = AD.onacc;
const BEAT = STUDIO.beat(SK);
document.documentElement.classList.add('skin-' + SK);
document.documentElement.style.setProperty('--acc', A);
document.documentElement.style.setProperty('--acc2', A2);
document.documentElement.style.setProperty('--onacc', ON);
let LOGO = '', QR = '';
const rect = (el) => el.getBoundingClientRect();
let UID = 0;
const uniq = (svg) => { const n = ++UID; return svg.replace(/id="([^"]+)"/g, `id="$1_${n}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${n})`); };
const art = (k) => uniq(ART[k]);
const mark = (size) => `<span class="mn" style="width:${size * 0.875}px;height:${size}px">${uniq(LOGO)}</span>`;
const ink = (s) => (s || '').replace(/\*([^*]+)\*/g, `<span style="color:${SK === 'neon' ? A2 : A}">$1</span>`);

// Which theme a shot is drawn in, per skin.
const DARKISH = new Set(['logo', 'ask', 'build', 'menu', 'kitchen', 'tiers', 'scan', 'outro', 'phone', 'type', 'install', 'chat', 'photo', 'countdown', 'lineup', 'ticket', 'evout']);
function themeOf(s) {
  if (SK === 'blob') return DARKISH.has(s.type) ? 'dark' : 'light';
  if (SK === 'paper' || SK === 'swiss') return 'light';
  return 'dark';
}

// ---------- words (each skin animates them its own way) ----------
const WDUR = { blob: 0.42, kinetic: 0.12, paper: 0.5, swiss: 0.35, neon: 0.4, pov: 0.25, cinema: 0.9 }[SK];
const SIZE = { blob: 1, kinetic: 1.3, paper: 1, swiss: 1.02, neon: 0.74, pov: 0.7, cinema: 0.92 }[SK];
function wordBlock(text, sub, { size = 116, width = 980 } = {}) {
  const el = h('div'); el.className = 'wblock';
  const ws = STUDIO.words(text);
  const lines = [];
  ws.forEach((w) => { (lines[w.line] = lines[w.line] || []).push(w); });
  el.innerHTML = lines.map((ln) => `<div class="wline disp" style="font-size:${size * SIZE}px">${ln.map((w) => `<span class="wd${w.accent ? ' acc' : ''}" style="${w.accent ? `color:${SK === 'neon' ? '#fff' : A}` : 'color:var(--fg)'}">${w.w}</span>`).join('')}</div>`).join('')
    + (sub ? `<div class="wsub">${ink(sub)}</div>` : '');
  el._ws = $$('.wd', el); el._acc = ws.map((w) => w.accent); el._text = text; el._width = width;
  return el;
}
function fitWords(el) { for (const ln of $$('.wline', el)) { const w = ln.scrollWidth; if (w > el._width) ln.style.fontSize = parseFloat(ln.style.fontSize) * el._width / w + 'px'; } }
function wordAnim(w, k, acc) {
  const e = eOut5(k);
  if (k <= 0) { w.style.opacity = 0; return; }
  switch (SK) {
    case 'kinetic': { w.style.opacity = 1; const r = (1 - e) * 22; w.style.transform = `scale(${lerp(1.45, 1, e)})`; w.style.textShadow = r > 0.5 ? `${r}px 0 #ff1f4b, ${-r}px 0 #22d3ee` : 'none'; break; }
    case 'paper': w.style.opacity = eOut(k); w.style.transform = `translateY(${(1 - e) * 50}px) rotate(${(1 - e) * 3}deg)`; break;
    case 'swiss': w.style.opacity = 1; w.style.clipPath = `inset(-10% ${(1 - e) * 100}% -10% 0)`; w.style.transform = `translateX(${(1 - e) * -24}px)`; break;
    case 'neon': { const p = [1, 0, 1, 0.2, 1, 0, 1, 1]; w.style.opacity = k < 1 ? p[Math.floor(k * 8) % 8] : 1; break; }
    case 'pov': w.style.opacity = 1; w.style.transform = `scale(${lerp(0.45, 1, eBack(k))})`; break;
    case 'cinema': w.style.opacity = eOut(k); w.style.filter = k < 1 ? `blur(${(1 - e) * 8}px)` : ''; w.style.transform = `translateY(${(1 - e) * 14}px)`; break;
    default: w.style.opacity = clamp(k * 1.6); w.style.filter = k < 1 ? `blur(${(1 - e) * 16}px)` : ''; w.style.transform = `translateX(${(1 - e) * -46}px) scale(${acc ? lerp(1.25, 1, eBack(k)) : 1})`;
  }
}
function drawWords(el, lt, start = STUDIO.W0) {
  el._ws.forEach((w, i) => wordAnim(w, prog(lt, start + i * STUDIO.WS - (SK === 'kinetic' ? 0 : 0.1), start + i * STUDIO.WS + WDUR), el._acc[i]));
  const sub = $('.wsub', el);
  if (sub) { const t0 = STUDIO.subTime(el._text, start); const k = prog(lt, t0 - 0.1, t0 + 0.35); sub.style.opacity = eOut(k); sub.style.transform = `translateY(${(1 - eOut(k)) * 16}px)`; }
}
function capEl(text, top) {
  const c = h('div', `top:${top}px`); c.className = 'cap';
  c.innerHTML = SK === 'pov' ? `<span class="box">${ink(text)}</span>` : ink(text);
  return c;
}
function drawCap(c, lt, at) { const k = prog(lt, at, at + 0.4); c.style.opacity = eOut(k); c.style.transform = `translateY(${(1 - eOut5(k)) * 26}px)`; }

// ---------- cursor, typing ----------
const CURSOR = `<svg viewBox="0 0 24 30" width="58" height="70"><path d="M2 2 L2 24 L8 18.5 L12 28 L16 26.3 L12 17 L20 17 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function cursorOn(parent) { const c = h('div', '', CURSOR); c.className = 'cursor'; const r = h('div'); r.className = 'ripple'; parent.append(c, r); return { c, r }; }
function drawCursor(cur, lt, path) {
  const pts = path.map(([t, target, click]) => { let x, y; if (Array.isArray(target)) [x, y] = target; else { const r = rect(target); x = r.left + r.width / 2; y = r.top + r.height / 2; } return [t, x, y, click]; });
  let x = pts[0][1], y = pts[0][2];
  for (let i = 1; i < pts.length; i++) { const [t0, x0, y0] = pts[i - 1], [t1, x1, y1] = pts[i]; if (lt >= t0) { const k = eIO(prog(lt, t0 + 0.02, t1 - 0.08)); x = lerp(x0, x1, k); y = lerp(y0, y1, k); } }
  let press = 1, rip = null;
  for (const [t, px, py, click] of pts) if (click && lt >= t - 0.06 && lt < t + 0.45) { if (lt < t + 0.1) press = 0.82; rip = [px, py, prog(lt, t, t + 0.45)]; }
  css(cur.c, { left: x - 6 + 'px', top: y - 4 + 'px', transform: `scale(${press})`, opacity: String(clamp(lt / 0.15)) });
  if (rip) css(cur.r, { left: rip[0] + 'px', top: rip[1] + 'px', opacity: String(1 - rip[2]), transform: `scale(${0.5 + rip[2] * 1.6})` }); else cur.r.style.opacity = 0;
}
const typed = (text, lt, a, b) => text.slice(0, Math.round(text.length * prog(lt, a, b)));
const caret = (lt, on) => `<span style="display:inline-block;width:4px;height:1em;vertical-align:-.12em;margin-left:4px;background:${A};opacity:${on && Math.floor(lt * 3) % 2 === 0 ? 1 : on ? 0.3 : 0}"></span>`;
const tilt = (el, lt, amt = 16) => { el.style.transform = `perspective(1800px) rotateX(${(1 - eOut5(prog(lt, 0, 0.5))) * amt + Math.sin(lt * 0.8) * 1.2}deg) rotateY(${Math.sin(lt * 0.6) * 2}deg)`; };
const show = (el, k, dy = 30) => { el.style.opacity = eOut(k); el.style.transform = `translateY(${(1 - eOut5(k)) * dy}px)`; };

// ---------- shot builders: each returns { el, fit?, draw(lt) } ----------
const B = {};

B.words = (s) => { const el = h('div'); const wb = wordBlock(s.text, s.sub, { size: 124 }); el.append(wb); return { el, fit: () => { fitWords(wb); wb.style.top = 950 - wb.offsetHeight / 2 + 'px'; }, draw(lt) { drawWords(wb, lt); if (SK !== 'kinetic') wb.style.transform = `scale(${1 + 0.04 * lt / s.d})`; } }; };

B.emoji = (s) => {
  const el = h('div');
  const em = h('div', 'position:absolute;left:0;right:0;top:360px;text-align:center;font-size:260px;line-height:1', s.emoji);
  const wb = wordBlock(s.text, s.sub, { size: 104 });
  el.append(em, wb);
  return { el, fit: () => { fitWords(wb); wb.style.top = '760px'; }, draw(lt) {
    const k = prog(lt, T.emoji.pop, T.emoji.pop + 0.4);
    em.style.opacity = k > 0 ? 1 : 0;
    em.style.transform = `scale(${lerp(0.2, 1, eBack(k))}) rotate(${Math.sin(lt * 7) * 6 * (1 - prog(lt, 0.5, 1.5)) + Math.sin(lt * 2) * 3}deg)`;
    drawWords(wb, lt, T.emoji.words);
  } };
};

B.burst = (s) => {
  const el = h('div');
  const bg = h('div', 'position:absolute;inset:0');
  const w = h('div', 'position:absolute;left:0;right:0;top:50%;text-align:center;white-space:nowrap');
  w.className = 'disp';
  el.append(bg, w);
  const step = s.d / s.words.length;
  const COLS = SK === 'kinetic' ? [['#000', '#fff'], ['#fff', '#000'], [A, ON], ['#000', A]] : [['transparent', 'var(--fg)'], ['transparent', A]];
  return { el, draw(lt) {
    const i = Math.min(s.words.length - 1, Math.floor(lt / step)), k = prog(lt - i * step, 0, 0.12);
    const [b, f] = COLS[i % COLS.length];
    bg.style.background = b;
    if (w._i !== i) {
      w._i = i; w.innerHTML = `<span style="display:inline-block">${s.words[i]}</span>`;
      w.style.fontSize = '100px'; const fs = Math.min(/\p{Extended_Pictographic}/u.test(s.words[i]) ? 260 : 460, 100 * 960 / w.firstChild.offsetWidth);
      w.style.fontSize = fs + 'px'; w.style.marginTop = -w.offsetHeight / 2 + 'px';
    }
    w.style.color = f;
    const r = (1 - eOut5(k)) * 24;
    w.style.transform = `scale(${lerp(1.4, 1, eOut5(k))})`;
    w.style.textShadow = SK === 'neon' ? `0 0 8px #fff, 0 0 30px ${A}, 0 0 70px ${A}` : r > 0.5 ? `${r}px 0 #ff1f4b, ${-r}px 0 #22d3ee` : 'none';
  } };
};

const SPOTS = [[200, 480, 330, -12], [870, 450, 300, 10], [170, 1360, 320, 8], [890, 1380, 330, -9], [540, 300, 250, 4], [560, 1610, 260, -4]];
B.collage = (s) => {
  const el = h('div');
  const items = s.items.map((k, i) => { const [x, y, sz] = SPOTS[i]; const a = h('div', `left:${x - sz / 2}px;top:${y - sz / 2}px;width:${sz}px;height:${sz}px`, art(k)); a.className = 'art'; el.append(a); return a; });
  const wb = wordBlock(s.text, s.sub, { size: 104 }); el.append(wb);
  return { el, fit: () => { fitWords(wb); wb.style.top = 930 - wb.offsetHeight / 2 + 'px'; }, draw(lt) {
    items.forEach((a, i) => {
      const [x, y, , rot] = SPOTS[i];
      const k = prog(lt, T.collage.items + i * T.collage.step, T.collage.items + i * T.collage.step + 0.5), e = eOut5(k);
      a.style.opacity = clamp(k * 3);
      a.style.transform = `translate(${(540 - x) * (1 - e)}px, ${(960 - y) * (1 - e) + Math.sin(lt * 2 + i) * 8}px) scale(${lerp(0.2, 1, e)}) rotate(${rot * e + Math.sin(lt * 1.6 + i) * 3}deg)`;
      a.style.filter = `drop-shadow(0 26px 30px rgba(0,0,0,${SK === 'neon' || SK === 'cinema' ? 0.5 : 0.18}))${k < 1 ? ` blur(${(1 - e) * 10}px)` : ''}`;
    });
    drawWords(wb, lt, T.collage.words);
  } };
};

function lockup(size, word = 'MartNepali') {
  const L = h('div', 'position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:28px');
  const disc = h('div', `width:${size * 1.6}px;height:${size * 1.6}px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 60px ${A}66`, mark(size));
  const txt = h('div', `font-size:${size * 1.05}px;line-height:1;white-space:nowrap;color:var(--fg)`); txt.className = 'disp';
  const neonGlow = SK === 'neon' ? `text-shadow:0 0 8px #fff,0 0 24px ${A},0 0 60px ${A}` : '';
  txt.innerHTML = [...word].map((c, i) => `<span style="display:inline-block;${i >= 4 ? `color:${SK === 'neon' ? '#fff' : A};` : ''}${neonGlow}">${c}</span>`).join('');
  if (SK === 'cinema' || SK === 'paper') txt.style.fontStyle = 'italic';
  L.append(disc, txt);
  return { L, disc, txt, letters: $$('span', txt) };
}

B.logo = (s) => {
  const el = h('div');
  const { L, disc, letters } = lockup(100);
  L.style.top = '800px';

B.phone = (s) => {

  ph.innerHTML = `<div class="vp" style="position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;transform:scale(${sc})">
    <img class="pg" src="../out/dashain/shots/${s.img}.png" style="position:absolute;left:0;top:0;width:390px">

    <div class="fg" style="position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0"></div>
    <div class="rp" style="position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid #fff;opacity:0"></div></div>`;

function transition(el, lt, d, last) {
  const tIn = { blob: 0.32, paper: 0.4, neon: 0.3, cinema: 0.45, pov: 0.18, kinetic: 0, swiss: 0 }[SK];
  const tOut = { blob: 0.24, paper: 0.3, neon: 0.2, cinema: 0.4, pov: 0, kinetic: 0, swiss: 0 }[SK];
  const ki = tIn ? eOut(prog(lt, 0, tIn)) : 1, ko = last || !tOut ? 0 : eIO(prog(lt, d - tOut, d));
  let o = ki * (1 - ko), f = '', tr = '';
  if (SK === 'blob') { f = ki < 1 || ko > 0 ? `blur(${(1 - ki) * 18 + ko * 20}px)` : ''; tr = `scale(${lerp(1.08, 1, ki) * lerp(1, 0.94, ko)})`; }
  if (SK === 'paper') tr = `translateY(${(1 - ki) * 40 - ko * 30}px)`;
  if (SK === 'neon') { const p = [1, 0, 1, 0.3, 1, 0, 1]; o = (ki < 1 ? p[Math.floor(ki * 7)] : 1) * (1 - ko); }
  if (SK === 'cinema') tr = `scale(${1 + 0.035 * lt / d})`;
  if (SK === 'pov') tr = `scale(${lerp(1.14, 1, eOut5(prog(lt, 0, 0.18)))})`;
  el.style.opacity = o; el.style.filter = f; el.style.transform = tr;
}

// ---------- setup / render ----------
const SHOTS = [];
let drawWorld = () => {};
window.setup = async function (qr) {
  QR = qr || '';
  try { LOGO = (await (await fetch('../out/dashain/martnepali-logo.svg')).text()).replace(/width="\d+"/, '').replace(/height="\d+"/, ''); } catch {}
  drawWorld = W[SK]();
  for (const s of AD.shots) {
    const shot = B[s.type](s);
    shot.el.className = 'shot t-' + themeOf(s);
    shot.s = s;
    $('#shots').append(shot.el);
    SHOTS.push(shot);
  }
  // Load every face before measuring text (hidden shots never ask for their fonts).
  await Promise.all(['800 60px "Plus Jakarta Sans"', '700 60px Inter', '800 60px Inter', '60px Anton', '900 60px Fraunces', '600 60px Fraunces', 'italic 600 60px Fraunces', 'italic 800 60px Fraunces', '700 60px "Space Grotesk"', '60px Audiowide', '800 60px Mukta'].map((f) => document.fonts.load(f).catch(() => {})));
  for (const sh of SHOTS) sh.el.style.display = 'block';
  await document.fonts.ready;
  await Promise.all($$('img').map((i) => i.decode().catch(() => {})));
  for (const sh of SHOTS) { sh.fit && sh.fit(); sh.el.style.display = 'none'; }
};
window.render = function (t) {
  drawWorld(t);
  SHOTS.forEach((sh, i) => {
    const s = sh.s, lt = t - s.t, last = i === SHOTS.length - 1;
    const on = lt >= 0 && (lt < s.d || last);
    sh.el.style.display = on ? 'block' : 'none';
    if (!on) return;
    transition(sh.el, lt, s.d, last);
    sh.draw(lt);
  });
};
if (!q.has('render')) addEventListener('load', async () => {
  await window.setup('');
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % AD.TOTAL); requestAnimationFrame(loop); }; loop(); }
  else window.render(parseFloat(q.get('t') || '0'));
});
</script>
