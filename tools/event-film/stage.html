      const sz = Math.sin(Math.PI * clamp(u)); m.scale.setScalar(on ? 0.3 + 0.9 * Math.min(1, sz * 2) : 0.001);

    });
    camera.position.set(Math.sin(lt * 0.3) * 0.4, 0.7, 10.5); camera.lookAt(0, 0.45, 0);
  },
  tools(lt, t) {
    const s = sc('tools');
    grid.visible = true; grid.position.set(0, -2.75, 0);
    const down = prog(lt, s.tapeStop[0], s.tapeStop[1]);
    const place = (dev, i, x, y, z, ry, from) => {
      const k = prog(lt, s.land[i], s.land[i] + 0.45);

      dev.rotation.set(lerp(0.6, 0.04, eOut(k)), ry + Math.sin(t * 0.7 + i) * 0.04, 0);
      power(dev, prog(lt, s.land[i] + 0.12, s.land[i] + 0.42) * (1 - 0.8 * down));
    };
    place(tablet, 0, 0, 0.2, -0.6, 0, [0, -7, -2]);
    place(phoneL, 1, -4.2, -0.2, 0.6, 0.42, [-11, 0, -2]);

    const k = eOut(prog(lt, 0, 3.75));
    camera.position.set(Math.sin(lt * 0.5) * 1.1, lerp(1.4, 0.9, k), lerp(13.2, 11.6, k)); camera.lookAt(0, 0.15, 0);
    fog.near = 12; fog.far = 45;
  },
  custom(lt, t) {
    const s = sc('custom');
    phoneC.visible = true; drawDesign(lt); power(phoneC, eOut(prog(lt, 0, 0.3)));
    const fk = eIn(prog(lt, s.fly[0], s.fly[1]));
    phoneC.position.set(lerp(2.55, 0, fk), lerp(-0.05, 0, fk) + float(t), lerp(0, 7.4, fk));
    phoneC.rotation.set(lerp(0.06, 0, fk), lerp(-0.55 + Math.sin(lt * 0.7) * 0.18, 0, fk), lerp(0.02, 0, fk));
    swatches.visible = true;
    swatches.position.copy(phoneC.position);
    swatches.children.forEach((g) => {
      const i = g.userData.i, a = (i / 6) * Math.PI * 2 + lt * 0.8, k = eBack(prog(lt, 0.4 + i * 0.07, 0.75 + i * 0.07));
      g.position.set(0.25 + Math.cos(a) * 1.85, Math.sin(a) * 1.85, Math.sin(a) * 1.2);
      g.scale.setScalar(Math.max(0.001, k * (1 - fk)));
      g.lookAt(camera.position);
    });
    camera.position.set(0, 0, 9.6); camera.lookAt(0, 0, 0);
    fog.near = 10; fog.far = 40;
  },
  cta(lt, t) {
    wave.visible = true; wave.position.set(0, -2.1, 0); waveMat.opacity = 1; waveAt(t, 1.15, 1.2);
    camera.position.set(Math.sin(lt * 0.3) * 1.0, 2.7, 9); camera.lookAt(0, -0.9, -10);
  },
};

    `<div style="width:130px;height:130px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px ${CR2}88">${mark(82)}</div><div style="font:800 118px/1 'Plus Jakarta Sans';letter-spacing:-.035em;color:#fff">Mart<span style="color:${CR2}">Nepali</span></div>`);
  const rows = s.rowText.map(([big, small]) => h('div', 'position:absolute;left:880px;display:flex;gap:26px;align-items:flex-start',
    `<span style="margin-top:6px;width:58px;height:58px;border-radius:50%;background:#16a34a;flex:none;display:flex;align-items:center;justify-content:center;font:800 32px/1 Inter;color:#fff;box-shadow:0 0 30px rgba(22,163,74,.6)">✓</span>
     <div><div style="font:800 62px/1.08 'Plus Jakarta Sans';letter-spacing:-.03em;color:#fff;white-space:nowrap">${ink(big)}</div><div style="margin-top:10px;font:600 32px/1.2 Inter;color:rgba(255,255,255,.72)">${small}</div></div>`));
  rows.forEach((r, i) => { r.style.top = 400 + i * 170 + 'px'; });
  const bar = h('div', `position:absolute;left:880px;width:860px;top:770px;height:110px;border-radius:999px;background:#fff;display:flex;align-items:center;gap:22px;padding:0 42px;box-shadow:-9px 0 0 ${CR2},9px 0 0 ${BL2},0 30px 80px rgba(0,0,0,.5);transform-origin:0 50%`,
    `<svg viewBox="0 0 24 24" width="42" height="42"><circle cx="10" cy="10" r="7" stroke="#111" stroke-width="3" fill="none"/><line x1="15.5" y1="15.5" x2="22" y2="22" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg><div class="tx" style="font:700 50px/1 Inter;color:#111"></div>`);
  el.append(shade, card, lock, ...rows, bar);
  return { el, setQR(img) { if (img) $('.qr', card).append(img); }, draw(lt) {
    shade.style.opacity = eOut(prog(lt, 0, 0.5));
    const ck = eOut5(prog(lt, s.card[0], s.card[1]));
    card.style.opacity = eOut(prog(lt, s.card[0], s.card[0] + 0.3));
    card.style.transform = `perspective(1600px) rotateY(${lerp(-55, 9, ck) + Math.sin(lt * 0.8) * 2}deg) rotateX(${lerp(18, 2, ck) + Math.sin(lt * 0.6) * 1.5}deg) translateY(${(1 - ck) * 80}px)`;
    $$('.cor', card).forEach((c, i) => { c.style.opacity = 0.65 + 0.35 * Math.sin(lt * 5 + i); });
    const beam = $('.beam', card), bk = (((lt - 0.4) % 1.6) + 1.6) % 1.6 / 1.6;
    beam.style.top = clamp(bk) * 440 - 3 + 'px'; beam.style.opacity = lt > 0.4 ? Math.sin(Math.PI * clamp(bk)) : 0;
    const lk = prog(lt, s.lockup, s.lockup + 0.4);
    const pulse = lt >= s.end ? 1 + 0.06 * Math.exp(-(lt - s.end) * 6) : 1;
    lock.style.opacity = eOut(lk); lock.style.transform = `translateX(${(1 - eOut5(lk)) * 60}px) scale(${pulse})`; lock.style.filter = lk < 1 ? `blur(${(1 - eOut(lk)) * 14}px)` : '';
    rows.forEach((r, i) => { const k = prog(lt, s.rows[i], s.rows[i] + 0.35); r.style.opacity = eOut(k); r.style.transform = `translateX(${(1 - eOut5(k)) * 80}px)`; r.style.filter = k < 1 ? `blur(${(1 - eOut(k)) * 10}px)` : ''; });
    const bk2 = prog(lt, s.typeA - 0.35, s.typeA - 0.05); bar.style.opacity = eOut(bk2); bar.style.transform = `scaleX(${lerp(0.3, 1, eOut5(bk2))})`;
    $('.tx', bar).innerHTML = typed(s.url, lt, s.typeA, s.typeB) + caret(lt, lt > s.typeA - 0.2);
  } };
};

// ======================= background =======================
const SHOTS = [];
const blobs = [0, 1, 2].map(() => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); $('#bl').append(p); return p; });
const TALK_BLOBS = [[1680, 200, 380], [220, 880, 400], [1000, 1040, 240]];
function blobPath(cx, cy, r, t, seed) {
  const N = 8, pts = [];
  for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2, rr = r * (1 + 0.17 * Math.sin(t * 1.1 + i * 1.7 + seed) + 0.09 * Math.sin(t * 2.0 + i * 2.9 + seed * 2)); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < N; i++) { const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N]; d += ` C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`; }
  return d + 'Z';
}
const FLASHES = [[F.bar(4) - 0.06, '#fff', 0.16], [F.bar(5), '#fff', 0.16], [F.bar(12) - 0.06, '#fff', 0.24], [F.bar(15), '#fff', 0.12]];
function shakeAt(t) {
  let dx = 0, dy = 0;
  for (const [st, a] of F.SHAKES) { const x = t - st; if (x >= 0 && x < 0.6) { const e = a * Math.exp(-x * 9); dx += Math.sin(x * 97 + st) * 18 * e; dy += Math.cos(x * 83 + st * 2) * 14 * e; } }
  return [dx, dy];
}
function world(t, i) {
  const s = S[i], prev = S[Math.max(0, i - 1)];
  const k = i === 0 ? 1 : prog(t, s.t, s.t + (s.theme === 'deep' ? 0.35 : 0.07));
  const c0 = BG[prev.theme], c1 = BG[s.theme];
  const bg = c0.map((v, j) => Math.round(lerp(v, c1[j], k)));
  $('#bg').style.background = `rgb(${bg})`;
  const light = s.theme === 'light';
  $('#blobs').style.display = light ? 'block' : 'none';
  if (light) blobs.forEach((p, n) => { const [x, y, r] = TALK_BLOBS[n]; p.setAttribute('d', blobPath(x + Math.sin(t * 0.5 + n) * 40, y + Math.cos(t * 0.4 + n) * 40, r * lerp(0.5, 1, eOut5(prog(t, s.t, s.t + 0.6))), t, n * 2.3)); p.setAttribute('fill', n === 1 ? BL : CR); p.setAttribute('opacity', n === 2 ? '0.35' : '0.55'); });
  const glow = $('#glow');
  glow.style.opacity = s.id === 'custom' ? eOut(prog(t, s.t, s.t + 0.6)) : 0;
  glow.style.background = `radial-gradient(760px 760px at ${70 + Math.sin(t * 0.7) * 3}% ${50 + Math.cos(t * 0.6) * 4}%, rgba(139,92,246,.3), rgba(255,45,85,.09) 45%, transparent 70%)`;
  $('#vig').style.opacity = light ? 0.2 : 1;
  $('#lines').style.opacity = s.id === 'yours' ? 1 : 0;
  $('#grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 200 - 100}px, ${(Math.floor(t * 24) * 53) % 200 - 100}px)`;
  $('#grain').style.mixBlendMode = light ? 'multiply' : 'screen';
  let fo = 0, fc = '#fff';
  for (const [ft, col, d] of FLASHES) { const fk = prog(t, ft, ft + d); if (fk > 0 && fk < 1) { fo = Math.max(fo, (1 - fk) * 0.8); fc = col; } }
  const end = prog(t, F.TOTAL - 0.6, F.TOTAL);
  if (end > 0) { fo = end; fc = '#000'; }
  $('#flash').style.background = fc; $('#flash').style.opacity = fo;
  return bg;
}

window.setup = async function (qr) {
  QR = qr || '';
  LOGO = (await (await fetch('assets/logo.svg')).text()).replace(/width="\d+"/, '').replace(/height="\d+"/, '');
  await document.fonts.ready;
  await Promise.all(['800 40px "Plus Jakarta Sans"', '700 40px Inter', '600 40px Inter', '800 40px Inter'].map((f) => document.fonts.load(f)));
  const { qrImg } = await build3D();
  for (const s of S) { const shot = B[s.id](s); shot.el.className = 'shot'; shot.s = s; $('#ui').append(shot.el); SHOTS.push(shot); }
  if (qrImg) { qrImg.style.cssText = 'width:100%;height:100%;display:block'; SHOTS.find((x) => x.s.id === 'cta').setQR(qrImg); }
  await Promise.all($$('img').map((i) => i.decode().catch(() => {})));
  for (const sh of SHOTS) { sh.el.style.display = 'block'; sh.fit && sh.fit(); sh.el.style.display = 'none'; }
};

window.render = function (t) {
  let i = 0; S.forEach((s, j) => { if (t >= s.t) i = j; });
  const s = S[i], lt = t - s.t, last = i === S.length - 1;
  const bg = world(t, i);
  for (const svg of $$('.mn svg')) { svg.pauseAnimations(); svg.setCurrentTime(t); }
  const ki = s.cutIn ? 1 : eOut(prog(lt, 0, 0.3)), ko = s.cutOut || last ? 0 : eIO(prog(lt, s.d - 0.22, s.d));
  const [sx, sy] = shakeAt(t);
  for (const sh of SHOTS) {
    const on = sh.s === s;
    sh.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    sh.el.style.opacity = ki * (1 - ko);
    sh.el.style.filter = ki < 1 || ko > 0 ? `blur(${(1 - ki) * 18 + ko * 22}px)` : '';
    sh.el.style.transform = `translate(${sx}px, ${sy}px) scale(${lerp(1.06, 1, ki) * lerp(1, 0.95, ko)})`;
  }
  const gl = GL_SCENES.has(s.id);
  canvas.style.display = gl ? 'block' : 'none';
  if (gl) {
    for (const o of [wave, burst, shock, grid, phoneA, phoneL, phoneR, phoneC, tablet, ticketH, ticketL, holo, money, swatches]) o.visible = false;
    fog.near = 10; fog.far = 60; fog.color.setRGB(bg[0] / 255, bg[1] / 255, bg[2] / 255, THREE.SRGBColorSpace);
    // As the scene's background (not the renderer's clear colour): RenderPass clears its
    // target with a colour converted outside the render, which comes out twice as bright.
    W3.background = fog.color;
    GL[s.id](lt, t);
    camera.position.x += sx * 0.004; camera.position.y -= sy * 0.004;
    canvas.style.filter = ki < 1 || ko > 0 ? `blur(${(1 - ki) * 14 + ko * 18}px)` : '';
    W3.updateMatrixWorld(); camera.updateMatrixWorld();
  }
  SHOTS[i].draw(lt);
  if (gl) composer.render();
};

if (!q.has('render')) addEventListener('load', async () => {
  await window.setup('');
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % F.TOTAL); requestAnimationFrame(loop); }; loop(); }
  else window.render(parseFloat(q.get('t') || '0'));
});
window.stageReady = true;
</script>
